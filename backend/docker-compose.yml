services:
  mysql:
    image: mysql:8.0
    container_name: lumen-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ai_platform
      MYSQL_USER: ai_user
      MYSQL_PASSWORD: ai_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: lumen-platform-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumen-platform-redis
    # 端口 16379 被同机 IntelliEngine-redis 占用,改为 26380 避开冲突。
    ports:
      - "26380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: lumen-platform-ollama
    # Ollama listens on 11434. Expose to host so manual `ollama` CLI
    # calls (e.g. `ollama pull`) also work from the Windows shell.
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # The ollama image is minimal — it ships neither `curl` nor
      # `wget`. The cleanest way to confirm the daemon is responsive
      # is to ask it to list its models: `ollama list` exits 0 once
      # the HTTP server is up and the model cache is hydrated.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    # M38.1 follow-up (2026-08-31): MinIO 自托管,S3-compatible dev 替代。
    # 端口 19000/19001 被同机 IntelliEngine-minio 占用,改为 29000/29001。
    # 注意:--console-address 必须是容器内部端口(默认 9001),不是 host 端口。
    # 早期写 ":29001" 是 bug,容器内 console 在 29001 但 host 29001 只 expose 容器 9001,console 不通。
    image: minio/minio:latest
    container_name: lumen-platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # minio 镜像里有 curl,直接探活端点;``/minio/health/live`` 是 liveness probe,
      # ``/minio/health/ready`` 要更严,启动期会 false。
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g  # 防 dev OOM

  prometheus:
    # Phase 1 Group B 2.4.5 (2026-09-04):Prometheus server 拉 uvicorn /metrics。
    # 端口 19090 避开 default 9090(同机可能冲突);config 走 monitoring/prometheus.yml,
    # rules 目录预留 B2c Alertmanager 告警规则。
    image: prom/prometheus:latest
    container_name: lumen-platform-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.enable-lifecycle'  # 允许 SIGHUP 热加载 config(rule 改了 curl POST /-/reload)
    ports:
      - "19090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    # Prometheus 容器内访问 host 上的 uvicorn:11335 —— host.docker.internal
    # 在 Windows Docker Desktop 默认 alias 不到,用 host-gateway(Linux 也有)。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # prom/prometheus 镜像 busybox 有 wget;``-/-healthy`` 是 liveness probe
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m  # dev OOM guard

  grafana:
    # Phase 1 Group B 2.4.5 (2026-09-04):Grafana 接 Prometheus 出 4 块看板。
    # 端口 31300 避开 default 3000(同机 PID 71304 占);admin 密码读 env var,
    # dev 默认 admin/admin(改 GRAFANA_ADMIN_PASSWORD 环境变量即可)。
    image: grafana/grafana:latest
    container_name: lumen-platform-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=  # 空占位,后续需要 grafana-clock / piechart 时改这里
    ports:
      - "31300:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      # grafana 镜像有 curl;``/api/health`` 返 200 当 dashboard provider / datasource
      # provisioning 跑完,如果 datasource 没配会返 503(可借此验 provisioning 是否成功)
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health | grep -q ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m

  celery_worker_doc:
    # Phase 1 Group A 1.3 (2026-09-03): doc_parse queue —— 文档处理(parse +
    # chunk + embed)。CPU/IO 重但单任务耗时短(1-3min),并发 -c 2。
    # `-Q doc_parse,default` 兜底接住无路由的 task(防死信)。
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumen-platform-celery-doc
    command: celery -A lumen_tasks.celery_app worker -Q doc_parse,default -c 2 -n celery_doc@%h --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend/data:/app/data
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend:/app
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend/data/easyocr:/root/.EasyOCR
      - D:/work-ai/0401-lingclaw-to-langchain-demo/storage:/storage
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy

  celery_worker_ppt:
    # Phase 1 Group A 1.3 (2026-09-03): ppt_gen queue —— PPT 视频生成,长任务
    # (可能 30min+),独立 worker + 并发 -c 2。
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumen-platform-celery-ppt
    command: celery -A lumen_tasks.celery_app worker -Q ppt_gen -c 2 -n celery_ppt@%h --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend/data:/app/data
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend:/app
      - D:/work-ai/0401-lingclaw-to-langchain-demo/storage:/storage
    depends_on:
      redis:
        condition: service_healthy

  celery_worker_eval:
    # Phase 1 Group A 1.3 (2026-09-03): eval_run queue —— RAG 评测,长任务
    # (soft_time_limit=7200s),独立 worker + 单并发 -c 1 避免互相干扰
    # (LLM 调用密集,串行更稳)。
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumen-platform-celery-eval
    command: celery -A lumen_tasks.celery_app worker -Q eval_run -c 1 -n celery_eval@%h --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend/data:/app/data
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend:/app
      - D:/work-ai/0401-lingclaw-to-langchain-demo/storage:/storage
    depends_on:
      redis:
        condition: service_healthy

  alertmanager:
    # Phase 1 Group B 2.4.7 / B2c (2026-09-04):告警路由 + 抑制 + 分组。
    # 端口 19093 避 default 9093(同机可能已有 AM 实例)。
    image: prom/alertmanager:latest
    container_name: lumen-platform-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:19093'
    ports:
      - "19093:9093"
    volumes:
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  node_exporter:
    # Phase 1 Group B 2.4.7 / B2c (2026-09-04):host 硬件 + OS 指标。
    # 端口 19100 避 default 9100。Host 模式 mount /proc /sys / 让 exporter 看到
    # 真实机器资源(container 自身 metric 不准)。
    image: prom/node-exporter:latest
    container_name: lumen-platform-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "19100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  redis_exporter:
    # Phase 1 Group B 2.4.7 / B2c (2026-09-04):Redis 指标(used_memory / connected_clients /
    # keyspace_hits / db_keys 等)。端口 19101 避 default 9121。
    image: oliver006/redis_exporter:latest
    container_name: lumen-platform-redis-exporter
    command:
      - '--redis.addr=redis://lumen-platform-redis:6379'
    ports:
      - "19101:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  es_data:
  redis_data:
  ollama_data:
  minio_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
