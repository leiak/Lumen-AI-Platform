services:
  mysql:
    image: mysql:8.0
    container_name: lumen-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ai_platform
      MYSQL_USER: ai_user
      MYSQL_PASSWORD: ai_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: lumen-platform-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumen-platform-redis
    # 端口 16379 被同机 IntelliEngine-redis 占用,改为 26380 避开冲突。
    ports:
      - "26380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: lumen-platform-ollama
    # Ollama listens on 11434. Expose to host so manual `ollama` CLI
    # calls (e.g. `ollama pull`) also work from the Windows shell.
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # The ollama image is minimal — it ships neither `curl` nor
      # `wget`. The cleanest way to confirm the daemon is responsive
      # is to ask it to list its models: `ollama list` exits 0 once
      # the HTTP server is up and the model cache is hydrated.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    # M38.1 follow-up (2026-08-31): MinIO 自托管,S3-compatible dev 替代。
    # 端口 19000/19001 被同机 IntelliEngine-minio 占用,改为 29000/29001。
    # 注意:--console-address 必须是容器内部端口(默认 9001),不是 host 端口。
    # 早期写 ":29001" 是 bug,容器内 console 在 29001 但 host 29001 只 expose 容器 9001,console 不通。
    image: minio/minio:latest
    container_name: lumen-platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # minio 镜像里有 curl,直接探活端点;``/minio/health/live`` 是 liveness probe,
      # ``/minio/health/ready`` 要更严,启动期会 false。
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g  # 防 dev OOM

  celery_worker_doc:
    # Phase 1 Group A 1.3 (2026-09-03): doc_parse queue —— 文档处理(parse +
    # chunk + embed)。CPU/IO 重但单任务耗时短(1-3min),并发 -c 2。
    # `-Q doc_parse,default` 兜底接住无路由的 task(防死信)。
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumen-platform-celery-doc
    command: celery -A lumen_tasks.celery_app worker -Q doc_parse,default -c 2 -n celery_doc@%h --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend/data:/app/data
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend:/app
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend/data/easyocr:/root/.EasyOCR
      - D:/work-ai/0401-lingclaw-to-langchain-demo/storage:/storage
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy

  celery_worker_ppt:
    # Phase 1 Group A 1.3 (2026-09-03): ppt_gen queue —— PPT 视频生成,长任务
    # (可能 30min+),独立 worker + 并发 -c 2。
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumen-platform-celery-ppt
    command: celery -A lumen_tasks.celery_app worker -Q ppt_gen -c 2 -n celery_ppt@%h --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend/data:/app/data
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend:/app
      - D:/work-ai/0401-lingclaw-to-langchain-demo/storage:/storage
    depends_on:
      redis:
        condition: service_healthy

  celery_worker_eval:
    # Phase 1 Group A 1.3 (2026-09-03): eval_run queue —— RAG 评测,长任务
    # (soft_time_limit=7200s),独立 worker + 单并发 -c 1 避免互相干扰
    # (LLM 调用密集,串行更稳)。
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumen-platform-celery-eval
    command: celery -A lumen_tasks.celery_app worker -Q eval_run -c 1 -n celery_eval@%h --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend/data:/app/data
      - D:/work-ai/0401-lingclaw-to-langchain-demo/backend:/app
      - D:/work-ai/0401-lingclaw-to-langchain-demo/storage:/storage
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  es_data:
  redis_data:
  ollama_data:
  minio_data:
